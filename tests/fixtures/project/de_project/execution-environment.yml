---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-25/de-supported-rhel9:latest

dependencies:
  python_interpreter:
    python_path: /usr/bin/python3.12

  system:
    - java-17-openjdk-headless [platform:rpm]

  python:
    - ansible-rulebook

  galaxy:
    collections:
      - name: ansible.eda

options:
  package_manager_path: /usr/bin/microdnf
  tags:
    - ansible_sample_de
